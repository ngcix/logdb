# =============================================================================
# LOGDB CONFIGURATION GUIDE (TOML FORMAT)
# =============================================================================
# Configuration for logdb log parsing and querying.
# This file is auto-generated by `logdb make` but can be customized.
#
# General Rules:
# 1. Column and type names are case-sensitive.
# 2. Always use single triple-quotes (''') for regex patterns to avoid escaping backslashes.
# 3. Column names with special characters (e.g., dots) must be quoted: "frame.number"
# =============================================================================

[logdb]
# Log type: determines which parser and configuration structure is used.
# Supported types: "dumpstate", "pcap"
# Example: "dumpstate" (Android system dump)
type = "dumpstate"

[table]
# The name of the table that will be created in the DuckDB database.
# This table will contain all parsed log records.
name = "dumpstate"

# Table schema as SQL column definitions (must be valid SQL syntax).
# DO NOT put a comma after the last column definition.
# Standard columns:
#   - line_no (BIGINT PRIMARY KEY): source line number for ordering/pagination
#   - raw_line (TEXT): original unparsed line for debugging
# Quoted names (e.g., "frame.number") are required for columns with special characters.
columns_sql = """
    line_no       BIGINT PRIMARY KEY,
    log_date      VARCHAR,
    log_time      VARCHAR,
    ts_order      BIGINT NOT NULL,
    level         VARCHAR(1),
    uid           VARCHAR,
    pid           VARCHAR,
    tid           VARCHAR,
    tag           VARCHAR NOT NULL,
    message       TEXT NOT NULL,
    raw_line      TEXT NOT NULL
"""

[filter]
# Regex patterns for parsing (dumpstate log type only).
# The parser evaluates each regex from top to bottom.
# The first one that matches is applied; the rest are skipped.
#
# REQUIRED SYNTAX: Use Named Capturing Groups: (?P<column_name>pattern)
# The column_name inside (?P<...>) MUST EXACTLY MATCH a column from [table].columns_sql.
regex = [
    # Example 1: Android kernel log format
    # Pattern: [timestamp] tag: message
    '''^(?:<\d+>)?\[(?P<log_time>\s*\d+\.\d+)\]\s+(?:(?P<tag>[^:\[][^:]*):\s+)?(?P<message>.*)$''',

    # Example 2: Standard Android logcat format
    # Pattern: MMM  DD HH:MM:SS tag[pid]: message
    '''^(?P<log_date>[A-Z][a-z]{2} \S+)\s+(?P<log_time>\S+)\s+\S+\s+(?P<tag>[^\s\[]+)(?:\[(?P<pid>\d+)\])?:\s*(?P<message>.*)$''',

    # Example 3: Timestamped format with brackets
    # Pattern: [YYYY-MM-DD HH:MM:SS] [tag] message
    '''^(?P<log_date>\S+)\s+(?P<log_time>\S+)\]\s+\[[^\]]*\]\s+\[(?P<tag>[^\]]*)\]\s+(?P<message>.*)$''',

    # Catch-all: Capture entire line as message if no format matches
    '''^(?P<message>.*)$'''
]

# For PCAP logs:
# Column names are tshark field names directly (e.g., "frame.number", "ip.src").
# No field mapping or [insert] section needed—columns are derived from [table].columns_sql.
#
# Example PCAP schema (with wireless fields):
# [table]
# name = "pcap"
# columns_sql = """
#     line_no                     BIGINT PRIMARY KEY,
#     "frame.number"              VARCHAR,
#     "frame.time"                VARCHAR,
#     "ip.src"                    VARCHAR,
#     "ip.dst"                    VARCHAR,
#     "tcp.srcport"               VARCHAR,
#     "tcp.dstport"               VARCHAR,
#     "_ws.col.protocol"          VARCHAR,
#     "_ws.col.info"              TEXT,
#     raw_line                    TEXT
# """
