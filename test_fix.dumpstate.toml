[logdb]
type = "dumpstate"

[table]
name = "dumpstate"
columns_sql = """
log_date      VARCHAR,
    log_time      VARCHAR,
    ts_order      BIGINT NOT NULL,
    level         VARCHAR(1),
    uid           VARCHAR,
    pid           VARCHAR,
    tid           VARCHAR,
    tag           VARCHAR NOT NULL,
    message       TEXT NOT NULL,
"""

[filter]
regex = [
  '''^(?:<\d+>)?\[(?P<log_time>\s*\d+\.\d+)\]\s+(?:(?P<tag>[^:\[][^:]*):\s+)?(?P<message>.*)$''',
  '''^(?P<log_date>[A-Z][a-z]{2} \S+)\s+(?P<log_time>\S+)\s+\S+\s+(?P<tag>[^\s\[]+)(?:\[(?P<pid>\d+)\])?:\s*(?P<message>.*)$''',
  '''^\[(?P<log_date>\S+)\s+(?P<log_time>\S+)\]\s+\[[^\]]*\]\s+\[(?P<tag>[^\]]*)\]\s+(?P<message>.*)$''',
  '''^\s*(?P<pid>\d+)/\s*(?P<tid>\d+)/(?P<tag>[A-Z]+)/(?P<level>[A-Z])/\s*[^/]+/\s*(?P<message>.*)$''',
  '''^(?P<log_date>\S+)\s+(?P<log_time>\S+)\s+(?P<level>[A-Z])/(?P<tag>[^(:\s]+)(?:\(\s*(?P<pid>\d+)\))?:\s*(?P<message>.*)$''',
  '''^(?P<log_date>\S+)\s+(?P<log_time>\S+)\s+(?P<uid>\S+)\s+(?P<pid>\S+)\s+(?P<tid>\S+)\s+(?P<level>[A-Z])\s+(?P<tag>[^:]*?)\s*:\s*(?P<message>.*)$''',
  '''^(?P<log_date>\S+)\s+(?P<log_time>\S+)\s+(?P<pid>\S+)\s+(?P<tid>\S+)\s+(?P<level>[A-Z])\s+(?P<tag>[^:]*?)\s*:\s*(?P<message>.*)$''',
]
